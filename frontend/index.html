<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />

      name="description"
      content="Arena Estudos ALEPA — questões comentadas, simulados, caderno de erros e tutor de IA para o concurso da Assembleia Legislativa do Pará."

    <style>
      /*
       * Tokens críticos do tema, inline de propósito: se por qualquer motivo
       * o global.css não carregar (cache teimoso, deploy parcial, extensão de
       * navegador), o app continua escuro em vez de virar uma página branca.
       */
      :root{
        --bg:#080b13; --bg2:#0d1220; --card:#0f1523; --card2:#141b2d; --line:#232c47;
        --line2:#2e3860;
        --txt:#e9edf8; --txt2:#98a4c2; --txt3:#6f7b9c;
        --pri:#4f7dfb; --pri2:#7fa0ff; --ok:#34d399; --err:#fb7185; --warn:#fbbf24; --gold:#f5c451;
        --shadow:0 1px 2px rgba(0,0,0,.4), 0 12px 32px -12px rgba(0,0,0,.55);
        --r:14px; --r-sm:10px; --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
      }
      html,body{margin:0;background:var(--bg);color:var(--txt)}
    </style>

    <meta name="apple-mobile-web-app-capable" content="yes" />
