server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compressão
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # SPA: qualquer rota cai no index.html (o React Router resolve o resto).
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Assets com hash podem ser cacheados por muito tempo.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # O service worker nunca deve ser cacheado.
  location = /sw.js {
    add_header Cache-Control "no-store";
  }

  # Proxy da API: o frontend sempre chama "/api" (endereço relativo).
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
